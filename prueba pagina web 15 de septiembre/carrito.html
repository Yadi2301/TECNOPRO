<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoPro - Tu Carrito de compras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0d233a;
        }
        .logo span {
            color: #2563eb;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .banner-carrito {
            background-color: #1e293b;
            color: #ffffff;
            padding: 30px 5%;
            font-size: 26px;
            font-weight: bold;
        }
        .banner-carrito span {
            color: #3b82f6;
        }
        .main-container {
            display: flex;
            gap: 25px;
            padding: 40px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .resumen-box {
            flex: 2;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .resumen-box h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 15px 0;
            font-size: 14px;
            color: #334155;
        }
        .monto-total-row td {
            font-weight: bold;
            color: #2563eb;
            font-size: 16px;
            border-top: 1px solid #e2e8f0;
        }
        .envio-box {
            flex: 1;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .envio-box h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .btn-comprar {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-comprar:hover {
            background-color: #1d4ed8;
        }
        .boleta-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #e2f2f8;
            border: 1px dashed #080e2c;
            border-radius: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Tecno<span>Pro</span></div>
        <nav>
            <a href="index.html">Productos</a>
            <a href="#">Ofertas</a>
            <a href="#">Nosotros</a>
            <a href="#">Contacto</a>
            <a href="#">🛒</a>
        </nav>
    </header>

    <div class="banner-carrito">
        Tu <span>Carrito</span> de compras
    </div>

    <div class="main-container">
        
        <div class="resumen-box">
            <h3>Resumen del pedido</h3>
            <table>
                <thead>
                    <tr>
                        <th>CÓDIGO</th>
                        <th>PRODUCTO</th>
                        <th>CANTIDAD</th>
                        <th>PRECIO</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>000001</td>
                        <td id="nombreProducto">Monitor Gear 27" FHD</td>
                        <td>1</td>
                        <td id="precioProducto">S/. 269.90</td>
                    </tr>
                    <tr class="monto-total-row">
                        <td colspan="3">Monto Total</td>
                        <td id="montoTotal">S/. 269.90</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="envio-box">
            <h3>Datos de envío</h3>
            <form id="compraForm">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" placeholder="Av. Ejemplo 123">
                </div>
                <div class="form-group">
                    <label>Selecciona un método de pago</label>
                    <select id="pago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta de Crédito / Débito">Tarjeta de Crédito / Débito</option>
                        <option value="Yape / Plin">Yape / Plin</option>
                    </select>
                </div>
                <button type="button" class="btn-comprar" onclick="generarBoleta()">Realizar compra</button>
            </form>

            <div id="boleta" class="boleta-container"></div>
        </div>

    </div>

   <script>
        /* OBTENER PARÁMETROS DE LA URL DE FORMA ROBUSTA */
        let params = new URLSearchParams(window.location.search);
        
        let productoSel = params.get('prod');
        let precioTexto = params.get('precio');

        /* SI NO VIENE UN PRODUCTO O PRECIO VÁLIDO EN LA URL, USAR EL MONITOR POR DEFECTO */
        if (!productoSel || !precioTexto) {
            productoSel = 'Monitor Gear 27" FHD';
            precioTexto = '269.90';
        }

        // Decodificar el texto del producto (por si tiene espacios codificados %20)
        productoSel = decodeURIComponent(productoSel);

        // Convertir precio a número asegurando punto decimal
        let pre = parseFloat(precioTexto);
        
        // Si el precio no es un número válido, asignar precio por defecto
        if (isNaN(pre)) {
            pre = 269.90;
        }

        let can = 1;

        /* ACTUALIZAR LOS CAMPOS DEL HTML CON LOS DATOS DE LA URL */
        document.getElementById("nombreProducto").innerText = productoSel;
        document.getElementById("precioProducto").innerText = "S/. " + pre.toFixed(2);
        document.getElementById("montoTotal").innerText = "S/. " + pre.toFixed(2);

        function generarBoleta() {
            let cli = document.getElementById("nombre").value;
            let correo = document.getElementById("correo").value;
            let direccion = document.getElementById("direccion").value;
            let pago = document.getElementById("pago").value;

            if (cli == "" || correo == "" || direccion == "") {
                alert("Por favor complete todos los datos de envío.");
                return;
            }

            /* OPERACIONES MATEMÁTICAS */
            let subtotal = pre * can;
            let igv = subtotal * 0.18;
            let neto = subtotal + igv;

            let boletaDiv = document.getElementById("boleta");
            boletaDiv.style.display = "block";

            let salida = "";
            salida += "<h4><b>TECNOPRO - BOLETA DE VENTA</b></h4>";
            salida += "<p>----------------------------------</p>";
            salida += "<p><b>Cliente:</b> " + cli + "</p>";
            salida += "<p><b>Correo:</b> " + correo + "</p>";
            salida += "<p><b>Dirección:</b> " + direccion + "</p>";
            salida += "<p><b>Pago:</b> " + pago + "</p>";
            salida += "<p>----------------------------------</p>";
            salida += "<p><b>Producto:</b> " + productoSel + "</p>";
            salida += "<p><b>Subtotal S/:</b> " + subtotal.toFixed(2) + "</p>";
            salida += "<p><b>IGV 18% S/:</b> " + igv.toFixed(2) + "</p>";
            salida += "<p><b>TOTAL A PAGAR S/:</b> " + neto.toFixed(2) + "</p>";
            salida += "<p>----------------------------------</p>";
            salida += "<p>¡Gracias por su compra!</p>";

            boletaDiv.innerHTML = salida;
        }
    </script>

</body>
</html>
